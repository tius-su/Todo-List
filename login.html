<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Super Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-dark: #4338ca;
            --bg: #F3F4F6;
            --surface: #FFFFFF;
            --text-main: #1F2937;
            --text-sub: #6B7280;
            --border: #E5E7EB;
            --danger: #EF4444;
        }

        [data-theme="dark"] {
            --bg: #111827;
            --surface: #1F2937;
            --text-main: #F9FAFB;
            --text-sub: #9CA3AF;
            --border: #374151;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: 0.3s;
        }

        .login-container {
            background: var(--surface);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border);
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .brand img {
            width: 40px;
            height: 40px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            background: var(--bg);
            color: var(--text-main);
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        input::placeholder {
            color: var(--text-sub);
        }

        .btn-login {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-login:hover {
            background: var(--primary-dark);
        }

        .btn-google {
            background: #4285F4;
        }

        .btn-google:hover {
            background: #3367d6;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            padding: 0 15px;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .icon-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-main);
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .error-message {
            color: var(--danger);
            margin-top: 10px;
            font-size: 0.85rem;
            display: none;
            text-align: center;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .checkbox-group input {
            width: auto;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: var(--primary);
            font-size: 0.85rem;
            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="theme-toggle">
        <button class="icon-btn" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
    </div>

    <div class="login-container">
        <div class="brand">
            <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
            <i class="fas fa-bolt"></i> Super Planner
        </div>

        <!-- User ID/Password Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="user-id"><i class="fas fa-user"></i> User ID</label>
                <input type="text" id="user-id" name="user-id" placeholder="Masukkan User ID" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan Password" autocomplete="current-password">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="remember-me" name="remember-me">
                <label for="remember-me">Ingat saya</label>
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <div class="divider">
            <span>atau</span>
        </div>

        <!-- Google Login Button -->
        <button id="google-login-btn" class="btn-login btn-google">
            <i class="fab fa-google"></i>
            <span>Masuk dengan Google</span>
        </button>

        <p class="error-message" id="error-message"></p>
    </div>

    <!-- Firebase Auth Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAn7gIui9U5Yt6dDjJAX-gIUxQCkzkwz-o",
            authDomain: "hutang-notes.firebaseapp.com",
            databaseURL: "https://hutang-notes-default-rtdb.firebaseio.com",
            projectId: "hutang-notes",
            storageBucket: "hutang-notes.firebasestorage.app",
            messagingSenderId: "705787619261",
            appId: "1:705787619261:web:44ba4dfad2535d202e94d4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Check if user is already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        // Handle User ID/Password Login
        window.handleLogin = async (event) => {
            event.preventDefault();
            
            const userId = document.getElementById('user-id').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember-me').checked;
            const errorMsg = document.getElementById('error-message');

            if (!userId || !password) {
                errorMsg.textContent = 'Mohon isi User ID dan Password';
                errorMsg.style.display = 'block';
                return;
            }

            // Create email from userID (for Firebase auth)
            const email = `${userId}@superplanner.local`;
            
            try {
                // Try to sign in with the constructed email
                await signInWithEmailAndPassword(auth, email, password);
                
                // Save remember me preference
                if (rememberMe) {
                    localStorage.setItem('rememberUserId', userId);
                } else {
                    localStorage.removeItem('rememberUserId');
                }
                
                window.location.href = 'index.html';
            } catch (error) {
                // If user doesn't exist, create a new account automatically (auto pill)
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-email') {
                    try {
                        // Auto-create user by attempting to sign in with a different method
                        // Since we don't have registration, we'll use a simple local storage approach
                        handleLocalLogin(userId, password, rememberMe);
                    } catch (localError) {
                        errorMsg.textContent = 'User ID atau Password salah';
                        errorMsg.style.display = 'block';
                    }
                } else if (error.code === 'auth/wrong-password') {
                    errorMsg.textContent = 'Password salah';
                    errorMsg.style.display = 'block';
                } else {
                    // Fallback to local storage login
                    handleLocalLogin(userId, password, rememberMe);
                }
            }
        };

        // Local storage based login (for user id/password without Firebase registration)
        function handleLocalLogin(userId, password, rememberMe) {
            const storedUsers = JSON.parse(localStorage.getItem('superPlannerUsers') || '{}');
            
            if (storedUsers[userId]) {
                // Verify password
                if (storedUsers[userId].password === password) {
                    // Login successful
                    localStorage.setItem('currentUser', userId);
                    if (rememberMe) {
                        localStorage.setItem('rememberUserId', userId);
                    } else {
                        localStorage.removeItem('rememberUserId');
                    }
                    window.location.href = 'index.html';
                    return;
                } else {
                    document.getElementById('error-message').textContent = 'Password salah';
                    document.getElementById('error-message').style.display = 'block';
                    return;
                }
            }
            
            // Auto-create user (auto pill feature)
            storedUsers[userId] = {
                password: password,
                createdAt: Date.now()
            };
            localStorage.setItem('superPlannerUsers', JSON.stringify(storedUsers));
            
            // Login
            localStorage.setItem('currentUser', userId);
            if (rememberMe) {
                localStorage.setItem('rememberUserId', userId);
            }
            
            window.location.href = 'index.html';
        }

        // Google Login
        document.getElementById('google-login-btn').addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    const credential = GoogleAuthProvider.credentialFromResult(result);
                    const token = credential.accessToken;
                    const user = result.user;
                }).catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    const email = error.customData?.email;
                    const credential = GoogleAuthProvider.credentialFromError(error);
                    
                    console.error("Google Sign-In Error:", errorMessage);
                    
                    // Show user-friendly error
                    const errorMsg = document.getElementById('error-message');
                    if (errorCode === 'auth/unauthorized-domain') {
                        errorMsg.innerHTML = 'Google Login tidak tersedia di domain ini.<br>Gunakan login dengan User ID dan Password!';
                        errorMsg.style.display = 'block';
                    } else {
                        errorMsg.textContent = 'Google Login gagal: ' + errorMessage;
                        errorMsg.style.display = 'block';
                    }
                });
        });

        // Theme toggle
        window.toggleTheme = () => {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') === 'dark';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        };

        // Check saved theme
        function checkTheme() {
            const saved = localStorage.getItem('theme');
            if (saved) {
                document.body.setAttribute('data-theme', saved);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.body.setAttribute('data-theme', 'dark');
            }
        }

        // Auto-fill remembered user ID
        function loadRememberedUser() {
            const rememberedUser = localStorage.getItem('rememberUserId');
            if (rememberedUser) {
                document.getElementById('user-id').value = rememberedUser;
                document.getElementById('remember-me').checked = true;
            }
        }

        // Initialize
        checkTheme();
        loadRememberedUser();
    </script>
</body>
</html>
